esphome:
  name: veskaac
  friendly_name: VeskaAC

esp8266:
  board: esp07

external_components:
  - source: components

logger:
  level: VERBOSE
  baud_rate: 0

api:
  encryption:
    key: !secret veskaac__encryption_key

ota:
  - platform: esphome
    password: !secret veskaac__ota_password

uart:
  id: uart_bus
  tx_pin: GPIO15
  rx_pin: GPIO13
  baud_rate: 9600
  parity: EVEN

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

sensor:
  - platform: homeassistant
    id: ext_temp
    entity_id: sensor.buro_gang_temperature_2
  - platform: homeassistant
    id: ac_power_watt
    entity_id: sensor.veskaac_power

climate:
  - platform: tcl_climate
    id: tcl_custom_climate
    uart_id: uart_bus
    name: "VeskaAC"
    ext_temp_sensor: ext_temp
    internal_temp:
      name: "Temperature Int"
    power_sensor: ac_power_watt
    ext_temp:
      name: "Temperature Ext1"
    power:
      name: "AC Power"
    sent_temp:
      name: "Temperature Cmd"
    beep: false
    display: false
    ramp_mode: false

select:
  - platform: template
    name: Vertical swing
    id: vswing
    entity_category: config
    options:
      - "Last position"
      - "Fix top"
      - "Fix upper"
      - "Fix mid"
      - "Fix lower"
      - "Fix bottom"
      - "Move full"
      - "Move upper"
      - "Move lower"
    set_action:
      then:
        lambda: |-
          id(tcl_custom_climate).control_vertical_swing(x);

  - platform: template
    name: Horizontal swing
    id: hswing
    entity_category: config
    options:
      - "Last position"
      - "Fix left"
      - "Fix mid left"
      - "Fix mid"
      - "Fix mid right"
      - "Fix right"
      - "Move full"
      - "Move left"
      - "Move mid"
      - "Move right"
    set_action:
      then:
        lambda: |-
          id(tcl_custom_climate).control_horizontal_swing(x);

switch:
  - platform: template
    name: "AC Beeper"
    id: beeper_switch
    restore_mode: DISABLED
    lambda: |-
      return id(tcl_custom_climate).is_beep_on();
    turn_on_action:
      then:
        lambda: |-
          id(tcl_custom_climate).set_beep_runtime(true);
    turn_off_action:
      then:
        lambda: |-
          id(tcl_custom_climate).set_beep_runtime(false);

  - platform: template
    name: "AC Display"
    id: display_switch
    restore_mode: DISABLED
    lambda: |-
      return id(tcl_custom_climate).is_display_on();
    turn_on_action:
      then:
        lambda: |-
          id(tcl_custom_climate).set_display_runtime(true);
    turn_off_action:
      then:
        lambda: |-
          id(tcl_custom_climate).set_display_runtime(false);
